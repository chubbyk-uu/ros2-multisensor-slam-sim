scan_matcher_odometry:
  ros__parameters:
    use_sim_time: true
    scan_topic: /scan
    odom_topic: /odom
    laser_odom_topic: /custom_slam/laser_odom
    laser_path_topic: /custom_slam/laser_path
    pose_graph_path_topic: /custom_slam/pose_graph_path
    aligned_points_topic: /custom_slam/aligned_scan_points
    matcher_diagnostics_topic: /custom_slam/matcher_diagnostics
    map_topic: /custom_slam/map
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    minimum_range: 0.12
    maximum_range: 12.0
    point_stride: 2
    maximum_odom_age: 0.10
    output:
      pose_translation_stddev: 0.05
      pose_rotation_stddev: 0.05
      degenerate_translation_stddev: 0.30
    minimum_translation_for_update: 0.05
    minimum_rotation_for_update: 0.05
    maximum_local_keyframes: 20
    maximum_path_poses: 5000
    path:
      publish_period: 0.5
      minimum_translation: 0.03
      minimum_rotation: 0.03
    map:
      resolution: 0.05
      ray_stride: 2
      publish_period: 0.5
      rebuild_keyframes_per_cycle: 4
      rebuild_period: 0.02
      hit_probability: 0.70
      miss_probability: 0.40
      minimum_probability: 0.12
      maximum_probability: 0.97
      padding_cells: 2
    pose_graph:
      maximum_path_poses: 2000
      sequential_translation_stddev: 0.05
      sequential_rotation_stddev: 0.05
    loop_closure:
      enabled: true
      minimum_keyframe_separation: 30
      minimum_travel_distance: 3.0
      check_interval: 10
      minimum_loop_closure_interval: 30
      search_radius: 0.6
      maximum_candidates: 3
      candidate_submap_half_width: 5
      minimum_candidate_chain_size: 10
      reject_degenerate_matches: true
      maximum_correction_translation: 0.50
      maximum_correction_rotation: 0.25
      translation_stddev: 0.05
      rotation_stddev: 0.05
      optimization_maximum_iterations: 50
      huber_scale: 1.0
      matcher:
        grid_resolution: 0.03
        smear_deviation: 0.10
        linear_search_window: 0.60
        angular_search_window: 0.50
        coarse_linear_resolution: 0.10
        coarse_angular_resolution: 0.10
        fine_linear_window: 0.05
        fine_angular_window: 0.05
        fine_linear_resolution: 0.01
        fine_angular_resolution: 0.01
        translation_penalty_weight: 0.05
        rotation_penalty_weight: 0.05
        degeneracy:
          enabled: true
          weak_direction_correction_scale: 0.0
        minimum_score: 0.55
        minimum_support_fraction: 0.50
        minimum_matched_points: 100
    matcher:
      grid_resolution: 0.02
      smear_deviation: 0.10
      linear_search_window: 0.15
      angular_search_window: 0.20
      coarse_linear_resolution: 0.04
      coarse_angular_resolution: 0.04
      fine_linear_window: 0.02
      fine_angular_window: 0.02
      fine_linear_resolution: 0.005
      fine_angular_resolution: 0.005
      translation_penalty_weight: 0.10
      rotation_penalty_weight: 0.10
      degeneracy:
        enabled: true
        normal_half_window: 3
        maximum_neighbor_distance_base: 0.05
        maximum_neighbor_distance_ratio: 0.05
        minimum_normal_count: 20
        minimum_effective_normal_count: 5.0
        minimum_information_ratio: 0.05
        weak_direction_correction_scale: 0.0
      minimum_score: 0.35
      minimum_support_fraction: 0.25
      minimum_matched_points: 40
