ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.10
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    publish_acceleration: false
    publish_tf: true
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # The wheel source contributes planar body velocity. Including the
    # measured zero lateral velocity encodes the differential-drive
    # non-holonomic constraint.
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # A raw IMU has no absolute yaw reference. Fuse only yaw rate here;
    # LiDAR scan matching remains responsible for global heading correction.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_nodelay: true
    imu0_remove_gravitational_acceleration: false
