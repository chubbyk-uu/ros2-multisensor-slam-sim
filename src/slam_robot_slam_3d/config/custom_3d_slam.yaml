/**:
  ros__parameters:
    use_sim_time: true
    input_topic: /lidar_3d/points
    output_topic: /custom_slam_3d/points_filtered

    # Match the simulated sensor's useful range and reduce the 720x16 scan
    # before scan-to-local-map registration.
    minimum_range: 0.25
    maximum_range: 20.0
    voxel_leaf_size: 0.10

    # Axis-aligned robot envelope expressed in lidar_3d_link. Returns inside
    # this volume cannot be external obstacles or useful map structure.
    self_filter:
      enabled: true
      min_x: -0.30
      max_x: 0.30
      min_y: -0.23
      max_y: 0.23
      min_z: -0.30
      max_z: 0.05

    # PCL Generalized ICP scan-to-local-map acceptance gates. The first ROS
    # integration keeps these under the same parameter namespace as the
    # preprocessor, but the preprocessing-only launch ignores this section.
    matcher:
      # The 55 m weak-geometry and three-rate rotation regressions converge
      # within ten outer GICP iterations; a higher cap only consumes the 10 Hz
      # front-end budget without improving their acceptance or error bounds.
      maximum_iterations: 10
      maximum_optimizer_iterations: 20
      correspondence_randomness: 20
      maximum_correspondence_distance: 0.50
      transformation_epsilon: 0.0001
      rotation_epsilon: 0.0001
      euclidean_fitness_epsilon: 0.0001
      minimum_points: 100
      minimum_correspondences: 80
      maximum_rmse: 0.15
      maximum_correction_translation: 0.60
      maximum_correction_rotation: 0.40
      # In weak translation directions, continuously scale the GICP correction
      # toward the wheel+IMU prediction. Below the full-suppression threshold,
      # keep the prediction exactly; between both thresholds, use a linear ramp.
      minimum_translation_information_ratio: 0.05
      full_suppression_translation_information_ratio: 0.01
      minimum_translation_information: 0.01
      full_suppression_translation_information: 0.002
      minimum_planar_information: 0.01
      minimum_yaw_information: 0.10
      degeneracy_handling_enabled: true

    front_end:
      input_topic: /custom_slam_3d/points_filtered
      odom_topic: /odom
      base_frame: base_footprint
      local_frame: custom_slam_3d_odom
      odom_frame: odom
      maximum_odom_age: 0.05
      force_planar_motion: true
      keyframe_translation: 0.25
      keyframe_rotation: 0.15
      maximum_odom_buffer_size: 200
      maximum_pending_clouds: 5
      maximum_consecutive_match_failures: 5
      local_submap:
        maximum_keyframes: 12
        voxel_leaf_size: 0.15

    loop_closure:
      # The asynchronous verifier can skip stale intermediate keyframes under
      # overload, but it must never grow without a diagnostic bound.
      maximum_pending_keyframes: 100
      scan_context:
        maximum_radius: 20.0
        radial_bins: 20
        angular_bins: 60
        minimum_keyframe_separation: 80
        minimum_travel_distance: 8.0
        # Unitless, rotation-aligned cosine distance in [0, 1]. Scan Context
        # is a retrieval proposal; GICP still makes the geometric decision.
        maximum_descriptor_distance: 0.05
        ring_key_candidate_count: 20
        maximum_candidates: 5

      verification:
        submap_neighbor_keyframes: 2
        submap_voxel_leaf_size: 0.15
        minimum_overlap_ratio: 0.30
        # This is a post-GICP graph-consistency bound, not a retrieval gate:
        # Align this graph-consistency gate with the maximum accepted GICP
        # correction.  A wider gate admitted false closures between repeated
        # structures as soon as the 8 m travel threshold was reached.
        maximum_front_end_translation_disagreement: 3.0
        maximum_correction_translation: 3.0
        maximum_correction_rotation: 1.0
        maximum_candidates: 3
        # At most one geometrically verified loop edge is retained for a
        # current keyframe, and accepted edges must be separated in time.
        # Repeated corridor geometry otherwise creates hundreds of redundant
        # constraints that overpower the sequential odometry chain.
        minimum_constraint_keyframe_interval: 30

    pose_graph:
      map_frame: map
      publish_map_to_odom_tf: true
      # Future-date the slowly updated map -> odom correction so Nav2 paths
      # stamped between consecutive 10 Hz scans remain transformable.
      transform_tolerance: 0.10
      maximum_iterations: 50
      loop_closure_huber_scale: 1.0
      sequential_translation_weight: 20.0
      sequential_rotation_weight: 20.0
      loop_translation_weight: 40.0
      loop_rotation_weight: 40.0
      # Batch accepted loop edges so repeated revisits cannot optimize the
      # whole graph once per keyframe.
      minimum_keyframe_interval: 30

    # Rebuild the globally corrected map from immutable keyframes in bounded
    # batches.  This topic is visualisation/mapping output, not a front-end
    # registration target.
    global_map:
      voxel_leaf_size: 0.15
      rebuild_keyframes_per_batch: 4
      rebuild_keyframe_interval: 10

    persistence:
      mode: mapping
      snapshot_path: ""
      load_snapshot: false
      save_on_shutdown: false

    occupancy_grid:
      resolution: 0.05
      minimum_obstacle_height: 0.05
      maximum_obstacle_height: 0.45
      keyframes_per_batch: 4
      # The front end still matches against the full 20 m preprocessed cloud;
      # this bounds only what reaches the 2D projection. A 16-beam sensor
      # samples a wall 18 m away at grazing incidence and with metres between
      # beams, so a whole wall segment can arrive with no return inside the
      # obstacle height band. The projection then shows no obstacle there and
      # exploration reads the gap as unexplored, which is how the robot ends
      # up driving into walls. RTAB-Map bounds the same thing with
      # Grid/RangeMax, defaulting to 5.0 m.
      maximum_ray_range: 8.0
      # /map is deliberately trinary for Nav2 and frontier exploration. The
      # underlying probability grid is published separately for diagnosis.
      # A cell becomes navigation-free after three independent free-ray
      # observations (40 -> 31 -> 23). This is the conventional 0.25
      # occupancy threshold, while weak hit evidence remains unknown.
      free_maximum: 25
      # An observed cell at or above 0.5 has evidence that net-favours being
      # occupied, so publishing it as unknown understates what the map already
      # knows. It also manufactures a frontier: exploration reads the wall as
      # unexplored space and drives at it, which cost three 120 s navigation
      # timeouts in one measured run. Unobserved cells are never scored, so
      # nothing is classified from the 0.5 prior alone. RTAB-Map resolves the
      # same question with a single GridGlobal/OccupancyThr of 0.5.
      occupied_minimum: 50
