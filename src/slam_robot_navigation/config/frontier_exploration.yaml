frontier_explorer:
  ros__parameters:
    use_sim_time: true
    update_rate: 1.0
    evaluation_candidate_limit: 5
    # Candidate gain is frontier length in metres. Straight-line distance is
    # only a cheap shortlist preference; the returned Nav2 path is the real
    # travel cost. Keeping both travel weights small prevents tiny 0.3 m
    # frontiers from starving larger boundaries elsewhere in the map.
    path_cost_weight: 0.05
    blacklist_radius: 0.5
    # Must outlive several full navigation timeouts so multiple permanently
    # unreachable residual frontiers cannot rotate back into consideration.
    blacklist_duration: 900.0
    navigation_timeout: 120.0
    # Bound action-server response and cancellation waits independently from
    # the much longer physical navigation deadline.
    action_response_timeout: 15.0
    minimum_known_free_cells: 100
    # Counted in independent looks, not update_rate ticks: map delivery is
    # asynchronous, so a tick-based window could take the whole completion
    # decision from a single stale snapshot.
    completion_empty_cycles: 5
    # A look also counts once the map has been unchanged this long, because a
    # finished exploration stops the robot, and a stopped robot produces no
    # keyframes and therefore no further map. Keep it above the observed
    # incremental map-delivery interval (well below 1 s in the structured
    # world), so a map merely between updates is never mistaken for a final one.
    completion_map_stale_timeout: 10.0
    minimum_goal_free_cell_growth: 100
    maximum_stagnant_goals: 3
    map_topic: /map
    save_snapshot_on_completion: true
    snapshot_service: /scan_to_map_odometry_3d/save_snapshot
    frontier:
      # Must match custom_3d_slam.yaml: Nav2 and the frontier detector consume
      # the same trinary projection contract. Pinned by
      # test_trinary_projection_contract.py, because these drifted apart once
      # already: occupied_minimum was lowered to 50 on the projection side and
      # left at 65 here. Nothing broke, since a trinary /map only ever carries
      # -1, 0 and 100, and both values classify 100 as occupied -- but a
      # comment claiming the two match while they do not is worse than no
      # comment, and the pair stops being harmless the moment either side
      # publishes an intermediate value again.
      free_maximum: 25
      occupied_minimum: 50
      minimum_cluster_cells: 8
      minimum_clearance: 0.25
      information_gain_weight: 2.0
      distance_weight: 0.05
      clearance_weight: 0.1
